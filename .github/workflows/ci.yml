name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore DgSales.slnx
      - run: dotnet build DgSales.slnx --configuration Release --no-restore
      - run: dotnet test DgSales.slnx --configuration Release --no-build
      - run: dotnet publish src/DgSales.Api/DgSales.Api.csproj --configuration Release --no-build --output artifacts/api
      - run: docker build --tag dg-sales-automation:ci .
