services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgsales}
      POSTGRES_USER: ${POSTGRES_USER:-dgsales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - dg-postgres:/var/lib/postgresql/data

volumes:
  dg-postgres:

