<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DG Sales Console</title><link rel="stylesheet" href="/site.css"></head><body>
<header><div><strong>DG Sales</strong><span>Owner console</span></div><button id="logout" class="secondary">Sign out</button></header>
<main><h1>Sales overview</h1><div id="metrics" class="metrics"></div>
<section><div class="section-title"><h2>Recent leads</h2><button onclick="load()" class="secondary">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>City</th><th>Source</th><th>Status</th><th>Action</th></tr></thead><tbody id="leads"></tbody></table></div></section>
<section><div class="section-title"><h2>Approved prices</h2><button onclick="document.querySelector('#price').showModal()">Add / replace price</button></div><div class="table-wrap"><table><thead><tr><th>Brand/model</th><th>kVA</th><th>Phase</th><th>Base price</th><th>GST</th><th>Active</th></tr></thead><tbody id="prices"></tbody></table></div></section></main>
<dialog id="price"><form id="priceForm"><h2>Add approved price</h2><div class="grid"><label>Brand<input name="brand" required></label><label>Model<input name="gensetModel" required></label><label>kVA<input name="kva" type="number" step="0.01" required></label><label>Phase<select name="phaseCount"><option value="1">1</option><option value="3">3</option></select></label><label>Base price<input name="basePrice" type="number" required></label><label>Markup<input name="standardMarkup" type="number" value="0"></label><label>Transport<input name="transportCharge" type="number" value="0"></label><label>Installation<input name="installationCharge" type="number" value="0"></label><label>Accessories<input name="accessoryCharge" type="number" value="0"></label><label>GST %<input name="gstPercent" type="number" value="18"></label><label>Effective from<input name="effectiveFrom" type="date" required></label><label>Reason<input name="changeReason" required></label></div><p id="priceError" class="error"></p><div class="actions"><button type="button" class="secondary" onclick="price.close()">Cancel</button><button>Save approved price</button></div></form></dialog>
<script src="/admin.js"></script></body></html>
