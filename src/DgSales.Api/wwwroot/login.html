<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DG Sales Login</title><link rel="stylesheet" href="/site.css"></head>
<body class="login"><form id="login"><h1>DG Sales</h1><p>Owner console</p><label>Username<input id="user" required autocomplete="username"></label><label>Password<input id="pass" type="password" required autocomplete="current-password"></label><button>Sign in</button><small id="error"></small></form>
<script>login.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/admin/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});if(r.ok)location='/admin/';else error.textContent='Invalid username or password';};</script></body></html>
